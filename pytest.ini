[pytest]
testpaths = packages/backtest/tests apps/api/tests packages/agent/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . packages/backtest packages/domain apps/api apps/api/src packages/agent packages/agent/src
asyncio_mode = auto
addopts = -v --strict-markers

markers =
    unit: Fast unit tests for backtesting calculations
    invariant: Mathematical invariants and determinism verification
    golden: Snapshot regression tests against benchmark datasets
    asyncio: Asynchronous tests
