[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Autonomous Quant Agent Core Engine for BacktestAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "fastmcp>=3.4.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = [
    "src",
    "../../packages/domain",
    "../../packages/mt5_mcp/src",
    "../../apps/api/src",
    "../../"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src", "../../"]
