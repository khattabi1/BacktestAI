# Example Strategy Tester Config File
# Copy this to your MT5 Config folder and rename to tester_config.ini
# OR pass it via: terminal64.exe /config:tester_config.ini
#
# CRITICAL: Do NOT add a [Common] section — it prevents the test from triggering.
# Date ranges are NOT set here — they are set in terminal.ini [Tester] section.

[Tester]
# EA filename WITHOUT the "Experts\" prefix
# MT5 adds "Experts\" automatically, so do not include it.
# Examples:
#   Moving Average.ex5
#   Examples\Moving Average\Moving Average.ex5
#   Advisors\MyEA.ex5
Expert=Examples\Moving Average\Moving Average.ex5

# Trading symbol
Symbol=EURUSD

# Timeframe as STRING (config uses string, terminal.ini uses numeric enum)
# Valid: M1 M2 M3 M4 M5 M6 M7 M8 M9 M10 M11 M12
#        H1 H2 H3 H4 H5 H6 H7 H8 H9 H10 H11 H12
#        D1 D2 D3 D4 D5 D6 D7  W1 W2 W3 W4 W5 W6  MN1
Period=H1

# Testing model
# 0 = every tick (RECOMMENDED — downloads tick data, most accurate)
# 2 = control points (faster, uses OHLC)
# 3 = mathematical calculation (AVOID — no historical data, no report!)
Model=0

# Initial deposit
Deposit=10000

# Account currency
Currency=USD

# Leverage (100 = 1:100)
Leverage=100

# Optimization mode
# 0 = normal test
# 1 = optimization
Optimization=0

# Execution mode
# 0 = real test
ExecutionMode=0

# Report output path (optional)
Report=C:\Reports\TestReport.html
